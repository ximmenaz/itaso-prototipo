<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Prototipo funcional ITASO-MX: claridad para decidir desde tu realidad.">
  <title>ITASO-MX | Prototipo funcional</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/identity.css">
  <link rel="stylesheet" href="css/landing.css?v=ref4">
  <link rel="stylesheet" href="css/caregiver-menu.css?v=ref4">
</head>
<body>
  <a class="skip-link" href="#app">Saltar al contenido</a>
  <header class="site-header">
    <a class="brand" href="#/inicio" aria-label="ITASO-MX, ir al inicio">
      <img class="brand-logo" src="assets/identity/logo-color.svg" alt="ITASO-MX">
    </a>
    <nav id="global-nav" aria-label="Navegación principal"></nav>
  </header>

  <main id="app" tabindex="-1" aria-live="polite"></main>

  <button id="audience-trigger" class="audience-trigger" type="button">
    <span aria-hidden="true">↗</span> ¿Quién está usando la página?
  </button>

  <div id="audience-modal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="audience-title">
      <button class="icon-button modal-close" type="button" data-close-modal aria-label="Cerrar">×</button>
      <p class="eyebrow">Elige tu experiencia</p>
      <h2 id="audience-title">¿Quién está usando la página?</h2>
      <p class="muted">Puedes cambiar de perfil en cualquier momento.</p>
      <div class="audience-grid">
        <article class="choice-card">
          <div class="resource-art" aria-hidden="true"><svg class="itaso-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="8"/><path d="M8 10h1m6 0h1m-8 4q4 5 8 0"/></svg></div>
          <h3>Niñas, niños y adolescentes</h3>
          <p>Aprende, juega y avanza a tu ritmo.</p>
          <button class="button primary" data-profile="nna" type="button">Entrar</button>
        </article>
        <article class="choice-card">
          <div class="resource-art" aria-hidden="true"><svg class="itaso-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 5c-3-3-6-1-8 1-2-2-5-4-8-1-5 5 2 11 8 15 6-4 13-10 8-15Z"/></svg></div>
          <h3>Cuidadores</h3>
          <p>Compara opciones y encuentra criterios útiles.</p>
          <button class="button primary" data-profile="caregiver" type="button">Continuar</button>
        </article>
      </div>
    </section>
  </div>

  <div id="toast-region" class="toast-region" aria-live="assertive" aria-atomic="true"></div>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/router.js"></script>
  <script src="js/decision.js"></script>
  <script src="js/identity.js"></script>
  <script src="js/landing.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
